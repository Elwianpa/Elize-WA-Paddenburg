<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="jouw naam" />
    <meta name="color-scheme" content="dark light" />

    <title>Elize's Digital Garden</title>
    <link rel="stylesheet" href="./css/normal.css" />

    <!-- Voeg jouw eigen domein toe in data-page -->
    <script
      data-page="https://elize-wa-paddenburg.nl/"
      src="./scripts/main.js"
      defer
    ></script>
  </head>
  <body>
    <header>
      <h1>Welcome to Elize's Digital Garden</h1>
    </header>

    <main>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="https://github.com/account/repo">Learning Log</a></li>
        </ul>
      </nav>

      <label>
        <input type="radio" name="theme" value="auto-theme" checked />
        auto
      </label>
      <label>
        <input type="radio" name="theme" value="light-theme" />
        light
      </label>
      <label>
        <input type="radio" name="theme" value="dark-theme" />
        dark
      </label>

      <img
        class="hyrax-image"
        src="images/screaminghyrax-.svg"
        alt="Screaming Hyrax"
        width="500"
      />

      <nav class="bubble-nav">
        <ul>
          <li>
            <a href="https://nl.pinterest.com/MeowzyPurr/digital-garden-wa/">
              <img
                src="images/Hyrax-bubble.svg"
                alt="Hyraxboardlink"
                style="width: 100px; height: 100px"
              />
            </a>
          </li>
          <li>
            <a href="https://open.spotify.com/playlist/4yNcU7CVOXtOfsQg60c3FQ">
              <img
                src="images/MusicZoey-bubble.svg"
                alt="Playlistlink"
                style="width: 100px; height: 100px"
              />
            </a>
          </li>
          <li>
            <a href="https://nl.pinterest.com/MeowzyPurr/fav-art/">
              <img
                src="images/Art-bubble.svg"
                alt="Artinspolink"
                style="width: 100px; height: 100px"
              />
            </a>
          </li>
        </ul>
      </nav>
    </main>

    <footer></footer>
  </body>
</html>
