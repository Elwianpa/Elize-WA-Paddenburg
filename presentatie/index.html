- Ziet er 'evil' uit op een leuke manier, door die tandjes. Vampierbeestje.

Ik wil ook allemaal gekke dingen doen. 
- Dress up game met Hyrax
- Dating game Hyrax
- Video's/soundeffects dat die schreeuwt. Categorieen van verschillende geluiden.
- Zoek de Hyrax
- Achtergrond met een patroon van het woord: WA! in Oranje/bruin animal crossing stijl geinspireerd.
- Informatief, grappig, leuk en speels. (expressief)

<br>
<br>
